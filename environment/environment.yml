name: endometriosis-study
channels:
  - bioconda
  - conda-forge
dependencies:
  - python=3.12
  # Louvain 0.8 still imports pkg_resources, removed in newer Setuptools.
  - setuptools>=75,<81
  - scanpy>=1.11,<1.12
  - anndata>=0.11,<0.13
  - pandas>=2.2
  - scipy>=1.14
  - numpy>=2.0
  - h5py>=3.11
  # Keep h5py and the HDF5 runtime on a compatible ABI generation.
  - hdf5>=2.1,<2.2
  # Scanpy 1.11 is verified with the pre-0.66 Numba cache implementation.
  - numba>=0.64,<0.66
  - matplotlib>=3.9
  - seaborn>=0.13
  - scikit-learn>=1.5
  # Parallel, thread-limited execution of independent Scrublet libraries.
  - joblib>=1.4
  - threadpoolctl>=3.5
  - statsmodels>=0.14
  # Donor-level raw-count pseudobulk differential expression in Python.
  - pydeseq2>=0.5,<0.6
  # Reproducible Open Targets drug-evidence queries with local result caching.
  - requests>=2.32
  - python-igraph>=0.11
  # Louvain reproduces the authors' gene-module clustering step.
  - louvain>=0.8
  - leidenalg>=0.10
  - scrublet>=0.2
  # Dataset-only scVI integration and decoded normalized expression.
  - scvi-tools>=1.5,<1.6
  # Reference-assisted cell-type annotation in the dedicated annotation section.
  - celltypist>=1.7,<1.8
  # Required by Scanpy's Seurat-v3 highly-variable-gene implementation.
  - scikit-misc>=0.5
  - ipykernel>=6.29
  - jupyterlab>=4.2
  - nbformat>=5.10
